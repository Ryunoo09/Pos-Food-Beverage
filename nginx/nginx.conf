# Reverse proxy produksi. Di-mount ke /etc/nginx/conf.d/default.conf.
# TLS/HTTPS belum aktif: tambahkan server block 443 + sertifikat (lihat
# docs/RUNBOOK.md) setelah domain dan sertifikat tersedia.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # SSE: buffer dan cache dimatikan, timeout panjang untuk koneksi KDS.
    location = /api/v1/kitchen/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check dari luar container (dipakai uptime monitor).
    location = /health {
        proxy_pass http://backend:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # SPA statis dari container frontend.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
