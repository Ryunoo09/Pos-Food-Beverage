name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pos_food_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_food_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test integrasi DB aktif di CI; seed dijalankan sekali sebelum test.
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: pos_food_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      ORDER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pos_food_test?sslmode=disable
      REPORT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pos_food_test?sslmode=disable
      SHIFT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pos_food_test?sslmode=disable
      PAYMENT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pos_food_test?sslmode=disable
      OPNAME_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pos_food_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      - name: Terapkan migrasi
        run: |
          for f in internal/db/migrations/*.up.sql; do
            psql "postgres://postgres:postgres@localhost:5432/pos_food_test" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Seed data uji
        run: |
          go run ./cmd/seed
          go run ./cmd/seed-domain
      - run: go test -race -count=1 -timeout=300s ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
